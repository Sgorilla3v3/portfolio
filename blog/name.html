<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>참여자 등록</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #f1f5f9;
            --accent-color: #06d6a0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --error-color: #ef4444;
            --success-color: #10b981;
            --background: #ffffff;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--background);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: var(--primary-color);
            padding: 32px 24px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }

        .form-container {
            padding: 32px 24px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            transition: color 0.2s ease;
        }

        .required::after {
            content: ' *';
            color: var(--error-color);
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 400;
            color: var(--text-primary);
            background: var(--background);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-appearance: none;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            transform: translateY(-1px);
        }

        .form-input:invalid {
            border-color: var(--error-color);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            font-weight: 400;
        }

        select.form-input {
            cursor: pointer;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 16px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 48px;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-input:focus + .input-icon {
            color: var(--primary-color);
        }

        .has-icon .form-input {
            padding-left: 48px;
        }

        .error-message {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 6px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .submit-btn {
            width: 100%;
            padding: 18px 24px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -8px var(--primary-color);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 500;
            text-align: center;
            display: none;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .secondary-actions {
            margin-top: 24px;
            text-align: center;
        }

        .btn-secondary {
            background: none;
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0 8px;
        }

        .btn-secondary:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background: rgba(37, 99, 235, 0.05);
        }

        @media (max-height: 700px) {
            body {
                padding: 12px;
            }
            
            .header {
                padding: 24px 24px 20px;
            }
            
            .form-container {
                padding: 24px;
            }
            
            .form-group {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 360px) {
            .container {
                margin: 0;
                border-radius: 16px;
            }
            
            .form-container {
                padding: 20px;
            }
        }

        /* iOS Safari specific fixes */
        @supports (-webkit-touch-callout: none) {
            .form-input {
                font-size: 16px; /* Prevents zoom on focus */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>참여자 등록</h1>
            <p>정보를 입력해주세요</p>
        </div>
        
        <div class="form-container">
            <form id="registrationForm" novalidate>
                <div class="form-group">
                    <label for="name" class="required">이름</label>
                    <div class="input-wrapper has-icon">
                        <input type="text" id="name" name="name" class="form-input" 
                               placeholder="홍길동" required maxlength="20">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <div class="error-message" id="nameError">이름을 입력해주세요</div>
                </div>

                <div class="form-group">
                    <label for="phone" class="required">연락처</label>
                    <div class="input-wrapper has-icon">
                        <input type="tel" id="phone" name="phone" class="form-input" 
                               placeholder="010-1234-5678" required>
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                    </div>
                    <div class="error-message" id="phoneError">올바른 연락처를 입력해주세요</div>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <div class="input-wrapper has-icon">
                        <input type="email" id="email" name="email" class="form-input" 
                               placeholder="example@email.com">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="error-message" id="emailError">올바른 이메일을 입력해주세요</div>
                </div>

                <div class="form-group">
                    <label for="organization">소속</label>
                    <div class="input-wrapper has-icon">
                        <input type="text" id="organization" name="organization" class="form-input" 
                               placeholder="회사명 또는 소속기관" maxlength="50">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category" class="required">참여구분</label>
                    <div class="input-wrapper">
                        <select id="category" name="category" class="form-input" required>
                            <option value="">선택해주세요</option>
                            <option value="일반">일반 참가자</option>
                            <option value="VIP">VIP</option>
                            <option value="스태프">스태프</option>
                            <option value="발표자">발표자</option>
                            <option value="언론">언론</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="error-message" id="categoryError">참여구분을 선택해주세요</div>
                </div>

                <div class="form-group">
                    <label for="memo">비고</label>
                    <div class="input-wrapper">
                        <textarea id="memo" name="memo" class="form-input" 
                                  placeholder="추가 정보나 특별한 요청사항을 입력해주세요" 
                                  maxlength="200"></textarea>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    등록하기
                </button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>등록 중...</div>
                </div>

                <div class="message" id="message"></div>

                <div class="secondary-actions">
                    <button type="button" class="btn-secondary" onclick="clearForm()">초기화</button>
                    <button type="button" class="btn-secondary" onclick="showParticipants()">목록보기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 전역 변수
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnH8aHDLj98dy57GhFp9mpYNetRtG0rTlg5Uz9G71cRlloOrPV4wbIE2aopfQhzF_n5A/exec'; // Apps Script URL을 여기에 입력

        // DOM 요소 참조
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');

        // 폼 초기화
        function clearForm() {
            form.reset();
            hideMessage();
            clearErrors();
        }

        // 메시지 표시
        function showMessage(text, type = 'success') {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    hideMessage();
                }, 3000);
            }
        }

        // 메시지 숨기기
        function hideMessage() {
            message.style.display = 'none';
        }

        // 에러 메시지 표시
        function showError(fieldId, errorText) {
            const errorElement = document.getElementById(`${fieldId}Error`);
            const inputElement = document.getElementById(fieldId);
            
            errorElement.textContent = errorText;
            errorElement.style.display = 'block';
            inputElement.style.borderColor = 'var(--error-color)';
        }

        // 에러 메시지 제거
        function clearError(fieldId) {
            const errorElement = document.getElementById(`${fieldId}Error`);
            const inputElement = document.getElementById(fieldId);
            
            errorElement.style.display = 'none';
            inputElement.style.borderColor = 'var(--border-color)';
        }

        // 모든 에러 메시지 제거
        function clearErrors() {
            const errorElements = document.querySelectorAll('.error-message');
            const inputElements = document.querySelectorAll('.form-input');
            
            errorElements.forEach(el => el.style.display = 'none');
            inputElements.forEach(el => el.style.borderColor = 'var(--border-color)');
        }

        // 연락처 포맷팅
        function formatPhone(phone) {
            const numbers = phone.replace(/[^\d]/g, '');
            if (numbers.length === 11) {
                return numbers.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
            }
            return phone;
        }

        // 입력 검증
        function validateForm() {
            let isValid = true;
            clearErrors();

            // 이름 검증
            const name = document.getElementById('name').value.trim();
            if (!name) {
                showError('name', '이름을 입력해주세요');
                isValid = false;
            } else if (name.length < 2) {
                showError('name', '이름은 2자 이상 입력해주세요');
                isValid = false;
            }

            // 연락처 검증
            const phone = document.getElementById('phone').value.trim();
            const phoneRegex = /^01[0-9]-\d{3,4}-\d{4}$/;
            if (!phone) {
                showError('phone', '연락처를 입력해주세요');
                isValid = false;
            } else if (!phoneRegex.test(formatPhone(phone))) {
                showError('phone', '올바른 연락처 형식이 아닙니다 (예: 010-1234-5678)');
                isValid = false;
            }

            // 이메일 검증 (선택사항이지만 입력했다면 검증)
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email && !emailRegex.test(email)) {
                showError('email', '올바른 이메일 형식이 아닙니다');
                isValid = false;
            }

            // 참여구분 검증
            const category = document.getElementById('category').value;
            if (!category) {
                showError('category', '참여구분을 선택해주세요');
                isValid = false;
            }

            return isValid;
        }

        // 로딩 상태 토글
        function toggleLoading(show) {
            if (show) {
                submitBtn.style.display = 'none';
                loading.style.display = 'block';
            } else {
                submitBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        // 폼 제출
        async function handleSubmit(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }

            toggleLoading(true);
            hideMessage();

            try {
                const formData = new FormData(form);
                const participantData = {
                    action: 'addParticipant',
                    participant: {
                        name: formData.get('name').trim(),
                        phone: formatPhone(formData.get('phone').trim()),
                        email: formData.get('email').trim(),
                        organization: formData.get('organization').trim(),
                        category: formData.get('category'),
                        memo: formData.get('memo').trim(),
                        timestamp: new Date().toISOString()
                    }
                };

                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(participantData),
                    redirect: 'follow'
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('참여자 등록이 완료되었습니다!', 'success');
                    clearForm();
                } else {
                    showMessage(result.message || '등록 중 오류가 발생했습니다.', 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('네트워크 오류가 발생했습니다. 다시 시도해주세요.', 'error');
            } finally {
                toggleLoading(false);
            }
        }

        // 참여자 목록 보기 (추후 구현)
        async function showParticipants() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const result = await response.json();

                if (result.success) {
                    console.log(result.participants); // 콘솔에 출력
                    alert("참여자 수: " + result.participants.length);
                    // 필요하다면 화면에 테이블로 표시 가능
                } else {
                    alert(result.message || "목록을 불러올 수 없습니다.");
                }
            } catch (error) {
                alert("네트워크 오류: " + error);
            }
        }


        // 이벤트 리스너
        form.addEventListener('submit', handleSubmit);

        // 연락처 입력 시 자동 포맷팅
        document.getElementById('phone').addEventListener('input', function(e) {
            e.target.value = formatPhone(e.target.value);
        });

        // 입력 필드 포커스 시 에러 메시지 제거
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                clearError(this.id);
            });
        });

        // 페이지 로드 완료 시
        document.addEventListener('DOMContentLoaded', function() {
            // 첫 번째 입력 필드에 포커스
            document.getElementById('name').focus();
            
            // Apps Script URL 확인
            if (APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
                showMessage('Apps Script URL이 설정되지 않았습니다.', 'error');
            }
        });
    </script>
</body>
</html>

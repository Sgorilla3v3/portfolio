<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>마케팅 실무 고도화를 위한 AI 활용 전략</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overflow: auto;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #0f172a;
            overflow: auto;
        }
        .accent-text {
            color: #2dd4bf; /* Teal 400 */
        }
        .highlight-box {
            background-color: rgba(45, 212, 191, 0.1);
            border-left: 4px solid #2dd4bf;
        }
        .learning-goal-item {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }
        #networkCanvas {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
        }
        .content-wrapper {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px;
        }
        .bottom-bar {
            position: relative;
            z-index: 10;
            padding: 40px 80px;
            background-color: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style id="slide-selected-style">
  [data-slide-selected]::before
  /* [data-slide-hover-selected]::before */ {
    content: '';
    position: absolute;
    top: -4px;
    left: -4px;
    width: 100%;
    height: 100%;
    box-sizing: content-box;
    padding: 4px;
    border-radius: 0px;
    outline: 2px solid #0f7fff !important;
    z-index: 10000;
    pointer-events: none;
  }

 /* [data-slide-hover-selected], */
  [data-slide-selected] {
    position: relative;
    outline: none;
    cursor: default;
  }

  img[data-slide-selected],
  img[data-slide-hover-selected],
  [data-slide-hover-selected],
  [item-slide-click-selected],
  [item-slide-selected] {
    border: 2px solid #0f7fff !important;
  }


</style></head>
<body>
<div class="slide-container">
<!-- Background Visual -->
<canvas id="networkCanvas" width="1280" height="720"></canvas>
<!-- Main Content -->
<div class="content-wrapper">
<div class="w-2/3">
<div class="mb-4 inline-block px-3 py-1 rounded-full border border-teal-500 text-teal-400 text-sm font-medium tracking-wider">
                    MARKETING &amp; AI INTEGRATION STRATEGY
                </div>
<h1 class="text-6xl font-black leading-tight mb-4 tracking-tight">
                    마케팅 실무 고도화를 위한<br>
<span class="accent-text">AI 활용 전략 브리핑</span>
</h1>
<p class="text-2xl text-gray-300 font-light mb-10">
                    AI 듀얼 브레인으로<br>
<strong>10배에서 50배까지</strong> 업무 생산성 혁신하기
                </p>
<div class="highlight-box p-6 rounded-r-lg max-w-2xl mb-8">
<div class="flex items-start">
<i class="fas fa-quote-left text-teal-500 text-2xl mr-4 mt-1"></i>
<div>
<p class="text-xl font-medium text-white italic leading-relaxed">
                                "내 자리가 AI에 의해 사라지는 것이 아니라,<br>
<span class="text-teal-300">AI를 사용하는 내 동료</span>에 의해서 사라진다."
                            </p>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom Learning Goals -->
<div class="bottom-bar">
<p class="text-sm text-gray-400 mb-4 font-bold tracking-widest uppercase">Key Learning Objectives</p>
<div class="grid grid-cols-4 gap-6">
<div class="learning-goal-item p-4 rounded-lg border border-gray-700 flex items-center">
<div class="w-10 h-10 rounded-full bg-blue-900 flex items-center justify-center text-blue-300 mr-3 flex-shrink-0">
<i class="fas fa-brain"></i>
</div>
<div>
<p class="text-sm font-bold text-gray-200">AI 본질 이해</p>
<p class="text-xs text-gray-400">패턴 인식 도구로서의 원리</p>
</div>
</div>
<div class="learning-goal-item p-4 rounded-lg border border-gray-700 flex items-center">
<div class="w-10 h-10 rounded-full bg-purple-900 flex items-center justify-center text-purple-300 mr-3 flex-shrink-0">
<i class="fas fa-comments"></i>
</div>
<div>
<p class="text-sm font-bold text-gray-200">프롬프트 전략</p>
<p class="text-xs text-gray-400">CoT &amp; Self-Prompt 마스터</p>
</div>
</div>
<div class="learning-goal-item p-4 rounded-lg border border-gray-700 flex items-center">
<div class="w-10 h-10 rounded-full bg-green-900 flex items-center justify-center text-green-300 mr-3 flex-shrink-0">
<i class="fas fa-cubes"></i>
</div>
<div>
<p class="text-sm font-bold text-gray-200">데이터 파싱</p>
<p class="text-xs text-gray-400">정보의 해체와 창의적 재조합</p>
</div>
</div>
<div class="learning-goal-item p-4 rounded-lg border border-gray-700 flex items-center">
<div class="w-10 h-10 rounded-full bg-pink-900 flex items-center justify-center text-pink-300 mr-3 flex-shrink-0">
<i class="fas fa-rocket"></i>
</div>
<div>
<p class="text-sm font-bold text-gray-200">업무 자동화</p>
<p class="text-xs text-gray-400">MCP &amp; 바이브 코딩 구축</p>
</div>
</div>
</div>
</div>
</div>
<script>
        // Canvas Animation for Abstract Network Background
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const nodes = [];
        const numNodes = 60;
        const connectionDistance = 180;

        class Node {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5; // Very slow movement
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 3 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(45, 212, 191, 0.4)'; // Teal with low opacity
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < numNodes; i++) {
                nodes.push(new Node());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw connections
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(45, 212, 191, ${0.15 * (1 - distance / connectionDistance)})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Draw nodes
            nodes.forEach(node => {
                node.update();
                node.draw();
            });

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>

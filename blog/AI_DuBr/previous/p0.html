<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta content="width=1280, height=720, initial-scale=1.0" name="viewport">
    <title>마케팅 실무 고도화를 위한 AI 활용 전략 교육</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
        }
        .serif-font {
            font-family: 'Noto Serif KR', serif;
        }
        .hbr-red {
            background-color: #B21F24;
        }
        .text-hbr-red {
            color: #B21F24;
        }
        .bg-hbr-red {
            background-color: #B21F24;
        }
        .gradient-overlay {
            background: linear-gradient(135deg, rgba(178, 31, 36, 0.05) 0%, rgba(178, 31, 36, 0.02) 100%);
        }
    </style>
</head>
<body class="w-[1280px] h-[720px] bg-white overflow-hidden shadow-2xl">
    <div class="relative w-full h-full flex">
        
        <!-- 왼쪽 메인 콘텐츠 영역 (70%) -->
        <div class="w-[70%] h-full flex flex-col justify-between px-20 py-16 bg-white relative z-20">
            
            <!-- 상단 액센트 라인 -->
            <div class="absolute top-0 left-0 w-full h-2 bg-hbr-red"></div>
            
            <!-- 헤더 영역 -->
            <div>
                <!-- 카테고리 태그 -->
                <div class="mb-6">
                    <div class="inline-flex items-center gap-2 px-4 py-2 bg-red-50 rounded-full">
                        <i class="fa-solid fa-microchip text-hbr-red"></i>
                        <span class="text-hbr-red font-bold tracking-wide text-xs uppercase">
                            AI Transformation Strategy
                        </span>
                    </div>
                </div>
                
                <!-- 메인 타이틀 -->
                <div class="mb-8">
                    <h1 class="serif-font text-[56px] font-black text-gray-900 leading-[1.15] tracking-tight">
                        마케팅 실무<br>
                        고도화를 위한<br>
                        <span class="text-hbr-red">AI 활용 전략</span> 교육
                    </h1>
                </div>
                
                <!-- 서브타이틀 -->
                <div class="pl-6 border-l-4 border-hbr-red">
                    <p class="text-xl text-gray-700 font-light leading-relaxed">
                        마케팅 전문가를 위한<br>
                        <strong class="font-bold text-gray-900">'AI 듀얼 브레인'</strong> 구축 로드맵
                    </p>
                </div>
            </div>
            
            <!-- 하단 정보 영역 -->
            <div class="pt-6 border-t-2 border-gray-200 flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Date</span>
                    <span class="text-lg font-semibold text-gray-800">2025년 12월 10일</span>
                </div>
                <div class="flex flex-col text-right">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Module</span>
                    <span class="text-lg font-semibold text-gray-800">Advanced PR Strategy</span>
                </div>
            </div>
        </div>
        
        <!-- 오른쪽 이미지 영역 (30%) -->
        <div class="w-[30%] h-full relative overflow-hidden">
            <!-- 배경 그라데이션 -->
            <div class="absolute inset-0 bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 z-0"></div>
            
            <!-- 이미지 -->
            <img 
                alt="AI Business Innovation" 
                class="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-overlay z-10"
                src="https://page.gensparksite.com/slides_images/bcfb46a4f3832bb22c2230b9ccf9adf2.webp"
            >
            
            <!-- 장식 요소 -->
            <div class="absolute inset-0 z-20 flex flex-col items-center justify-center p-8">
                <!-- 아이콘 -->
                <div class="mb-8 text-white opacity-20">
                    <i class="fa-solid fa-brain text-8xl"></i>
                </div>
                
                <!-- 인용구 -->
                <div class="text-white text-center">
                    <div class="text-4xl mb-4 opacity-30">
                        <i class="fa-solid fa-quote-left"></i>
                    </div>
                    <p class="text-sm font-light tracking-wide opacity-80 leading-relaxed max-w-[200px] mx-auto">
                        "AI is a tool for discovering hidden patterns and combining them."
                    </p>
                </div>
            </div>
            
            <!-- 기하학적 패턴 -->
            <svg class="absolute top-0 right-0 w-full h-full opacity-10 z-15" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <circle cx="20" cy="20" r="1" fill="white" opacity="0.3"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)"/>
            </svg>
            
            <!-- 하단 액센트 -->
            <div class="absolute bottom-0 left-0 w-full h-1 bg-hbr-red z-30"></div>
        </div>
        
    </div>
</body>
</html>

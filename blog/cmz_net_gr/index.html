<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사업 네트워크 그래프</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* ── 변수 ── */
:root {
  --bg:          #0f1117;
  --bg2:         #181c27;
  --panel:       #1e2333;
  --border:      rgba(255,255,255,0.08);
  --border-mid:  rgba(255,255,255,0.15);
  --text:        #e2e8f0;
  --text2:       #94a3b8;
  --text3:       #64748b;
  --teal:        #2dd4bf;
  --teal-dim:    rgba(45,212,191,0.15);
  --purple:      #a78bfa;
  --purple-dim:  rgba(167,139,250,0.15);
  --coral:       #fb7185;
  --amber:       #fbbf24;
  --blue:        #60a5fa;
  --green:       #4ade80;
  --gray:        #64748b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── 로딩 ── */
#loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; z-index: 999;
}
#loading p { color: var(--text2); font-size: 13px; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border); border-top-color: var(--teal);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#error-msg { display: none; color: var(--coral); font-size: 13px; text-align: center; line-height: 1.8; }

/* ── 툴바 ── */
#toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px; height: 48px; min-height: 48px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow-x: auto; overflow-y: hidden;
}
#toolbar::-webkit-scrollbar { height: 3px; }
#toolbar::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }
#toolbar h1 { font-size: 13px; font-weight: 700; white-space: nowrap; letter-spacing: -.01em; }

.t-sep { width: 1px; min-width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

.filter-group { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.filter-label {
  font-size: 10px; font-weight: 600; color: var(--text3);
  white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; margin-right: 2px;
}

/* 버튼 공통 */
.btn {
  padding: 3px 9px; border-radius: 14px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text2); font-size: 11px; cursor: pointer;
  transition: all .12s; white-space: nowrap; flex-shrink: 0; line-height: 1.6;
}
.btn:hover { border-color: var(--border-mid); color: var(--text); }

/* 기관 필터 — 단일 선택 */
.btn[data-filter="org"].active                             { background: rgba(255,255,255,0.08); border-color: var(--border-mid); color: var(--text); }
.btn[data-filter="org"][data-val="cheongdo_center"].active { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }
.btn[data-filter="org"][data-val="gbsm_foundation"].active { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); }

/* 유형 필터 — 복수 선택, 점선 테두리로 구분 */
.btn[data-filter="type"]                                  { border-style: dashed; }
.btn[data-filter="type"].active                           { border-style: solid; }
.btn[data-filter="type"][data-val="org_host"].active      { background: rgba(45,212,191,.12);  border-color: var(--teal);   color: var(--teal); }
.btn[data-filter="type"][data-val="program"].active       { background: rgba(45,212,191,.09);  border-color: var(--teal);   color: var(--teal); }
.btn[data-filter="type"][data-val="project"].active       { background: rgba(45,212,191,.06);  border-color: var(--teal);   color: var(--teal); }
.btn[data-filter="type"][data-val="org_partner"].active   { background: rgba(251,113,133,.12); border-color: var(--coral);  color: var(--coral); }
.btn[data-filter="type"][data-val="funder"].active        { background: rgba(251,191,36,.12);  border-color: var(--amber);  color: var(--amber); }
.btn[data-filter="type"][data-val="space"].active         { background: rgba(96,165,250,.12);  border-color: var(--blue);   color: var(--blue); }
.btn[data-filter="type"][data-val="person"].active        { background: rgba(100,116,139,.18); border-color: var(--gray);   color: var(--text2); }
.btn[data-filter="type"][data-val="person_group"].active  { background: rgba(100,116,139,.12); border-color: var(--gray);   color: var(--text2); }

/* 연도 필터 — WIP */
.btn[data-filter="year"]         { opacity: .45; cursor: not-allowed; }
.btn[data-filter="year"]:hover   { opacity: .6; border-color: var(--border); color: var(--text2); }
.btn[data-filter="year"].active  { opacity: 1; background: rgba(74,222,128,.1); border-color: var(--green); color: var(--green); cursor: pointer; }
.btn[data-filter="year"][data-val="all"] { opacity: .75; cursor: pointer; }

.wip-badge {
  font-size: 9px; padding: 1px 5px; border-radius: 8px;
  background: rgba(251,191,36,.12); color: var(--amber);
  border: 1px solid rgba(251,191,36,.3);
  white-space: nowrap; flex-shrink: 0;
}

/* 초기화 */
#btn-reset {
  padding: 3px 9px; border-radius: 14px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text3); font-size: 11px; cursor: pointer;
  transition: all .12s; white-space: nowrap; flex-shrink: 0;
}
#btn-reset:hover { border-color: var(--coral); color: var(--coral); }

/* 검색 */
#search {
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: 11px; padding: 4px 9px;
  width: 140px; outline: none; flex-shrink: 0;
}
#search:focus { border-color: var(--border-mid); }
#search::placeholder { color: var(--text3); }

/* 인원 토글 */
#btn-hidden {
  padding: 3px 9px; border-radius: 14px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text3); font-size: 11px; cursor: pointer;
  transition: all .12s; white-space: nowrap; flex-shrink: 0;
}
#btn-hidden:hover  { border-color: var(--border-mid); color: var(--text2); }
#btn-hidden.active { background: rgba(100,116,139,.15); border-color: var(--gray); color: var(--text2); }

#stats { font-size: 10px; color: var(--text3); white-space: nowrap; flex-shrink: 0; margin-left: auto; }

/* ── 레이아웃 ── */
#main { display: flex; flex: 1; overflow: hidden; }
#graph-wrap { flex: 1; position: relative; overflow: hidden; }
svg { width: 100%; height: 100%; }

/* ── 사이드 패널 ── */
#panel {
  width: 236px; background: var(--bg2); border-left: 1px solid var(--border);
  padding: 14px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
}
#panel h2 { font-size: 10px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.detail-empty  { font-size: 12px; color: var(--text2); line-height: 1.7; }
.detail-name   { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--text); }
.detail-badge  { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }
.detail-row    { display: flex; flex-direction: column; gap: 2px; }
.detail-row label { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
.detail-row span  { font-size: 12px; color: var(--text); }
.detail-note   { font-size: 11px; color: var(--text2); line-height: 1.5; }
.conn-list     { display: flex; flex-direction: column; gap: 3px; }
.conn-item     { font-size: 11px; color: var(--text2); padding: 4px 7px; background: var(--panel); border-radius: 4px; line-height: 1.4; }
.conn-item strong { color: var(--text); display: block; font-size: 11px; }
.conn-rel      { font-size: 10px; color: var(--text3); }

/* ── 범례 ── */
#legend {
  position: absolute; bottom: 14px; left: 14px;
  background: rgba(15,17,23,0.92); backdrop-filter: blur(10px);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 13px; display: flex; flex-direction: column; gap: 4px; font-size: 11px;
}
.leg-title { font-size: 9px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin: 4px 0 2px; }
.leg-title:first-child { margin-top: 0; }
.leg-row   { display: flex; align-items: center; gap: 7px; color: var(--text2); }
.leg-dot   { border-radius: 50%; flex-shrink: 0; }
.leg-line  { height: 2px; border-radius: 1px; flex-shrink: 0; width: 20px; }

/* ── 줌 ── */
#zoom-ctrl { position: absolute; bottom: 14px; right: 6px; display: flex; flex-direction: column; gap: 4px; }
.zoom-btn {
  width: 26px; height: 26px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text2); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .12s;
}
.zoom-btn:hover { color: var(--text); border-color: var(--border-mid); }

/* ── D3 ── */
.link { stroke-opacity: 0.38; fill: none; }
.node circle { cursor: pointer; stroke-width: 1.5; }
.node text   { pointer-events: none; }
.node.dimmed circle, .node.dimmed text { opacity: 0.07; }
.node.highlighted circle { stroke-width: 2.5; filter: brightness(1.2); }
.link.dimmed      { stroke-opacity: 0.03; }
.link.highlighted { stroke-opacity: 0.82; }
</style>
</head>
<body>

<!-- 로딩 -->
<div id="loading">
  <div class="spinner"></div>
  <p id="load-msg">graph.json 불러오는 중…</p>
  <p id="error-msg"></p>
</div>

<!-- 툴바 -->
<div id="toolbar" style="display:none">
  <h1>사업 네트워크</h1>
  <div class="t-sep"></div>

  <!-- 기관 — 단일 선택 -->
  <div class="filter-group">
    <span class="filter-label">기관</span>
    <button class="btn active" data-filter="org" data-val="all">전체</button>
    <button class="btn" data-filter="org" data-val="cheongdo_center">청도혁신센터</button>
    <button class="btn" data-filter="org" data-val="gbsm_foundation">경북시민재단</button>
  </div>
  <div class="t-sep"></div>

  <!-- 유형 — 복수 선택 -->
  <div class="filter-group">
    <span class="filter-label">유형</span>
    <button class="btn" data-filter="type" data-val="org_host">운영기관</button>
    <button class="btn" data-filter="type" data-val="program">사업</button>
    <button class="btn" data-filter="type" data-val="project">팀·활동</button>
    <button class="btn" data-filter="type" data-val="org_partner">협력기관</button>
    <button class="btn" data-filter="type" data-val="funder">발주·재원</button>
    <button class="btn" data-filter="type" data-val="space">공간</button>
    <button class="btn" data-filter="type" data-val="person">인물</button>
    <button class="btn" data-filter="type" data-val="person_group">그룹</button>
  </div>
  <div class="t-sep"></div>

  <!-- 연도 — WIP, 단일 선택 -->
  <div class="filter-group">
    <span class="filter-label">연도</span>
    <span class="wip-badge">준비중</span>
    <button class="btn active" data-filter="year" data-val="all">전체</button>
    <button class="btn" data-filter="year" data-val="2024">2024</button>
    <button class="btn" data-filter="year" data-val="2025">2025</button>
    <button class="btn" data-filter="year" data-val="2026">2026</button>
  </div>
  <div class="t-sep"></div>

  <!-- 초기화 -->
  <button id="btn-reset">초기화</button>
  <div class="t-sep"></div>

  <!-- 검색 -->
  <input id="search" type="text" placeholder="노드 검색…" autocomplete="off">
  <div class="t-sep"></div>

  <!-- 참여인원 토글 -->
  <button id="btn-hidden">인원 표시</button>

  <span id="stats"></span>
</div>

<!-- 메인 -->
<div id="main" style="display:none">
  <div id="graph-wrap">
    <svg id="svg"></svg>

    <!-- 범례 -->
    <div id="legend">
      <div class="leg-title">노드 유형</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--teal);width:13px;height:13px"></div>운영기관</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--teal);opacity:.65;width:10px;height:10px"></div>사업 (청도)</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--purple);opacity:.65;width:10px;height:10px"></div>사업 (경북재단)</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--teal);opacity:.28;width:7px;height:7px"></div>팀·활동 (청도)</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--purple);opacity:.28;width:7px;height:7px"></div>팀·활동 (경북재단)</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--coral);width:9px;height:9px"></div>협력기관</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--amber);width:9px;height:9px"></div>발주·재원</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--blue);width:9px;height:9px"></div>공간</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--gray);width:8px;height:8px"></div>인물 / 그룹</div>
      <div class="leg-title">참여자 그룹 크기</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--gray);opacity:.4;width:6px;height:6px"></div>소규모 5~15명</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--gray);opacity:.4;width:12px;height:12px"></div>중규모 25~70명</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--gray);opacity:.4;width:20px;height:20px"></div>대규모 100명+</div>
      <div class="leg-title">관계</div>
      <div class="leg-row"><div class="leg-line" style="background:var(--teal)"></div>운영</div>
      <div class="leg-row"><div class="leg-line" style="background:var(--coral)"></div>수행</div>
      <div class="leg-row"><div class="leg-line" style="background:var(--amber)"></div>투자·지원</div>
      <div class="leg-row"><div class="leg-line" style="background:var(--blue)"></div>거점</div>
      <div class="leg-row"><div class="leg-line" style="background:var(--gray)"></div>참여 / 연계</div>
    </div>

    <!-- 줌 -->
    <div id="zoom-ctrl">
      <button class="zoom-btn" id="zIn">+</button>
      <button class="zoom-btn" id="zOut">−</button>
      <button class="zoom-btn" id="zReset" style="font-size:11px">⟲</button>
    </div>
  </div>

  <!-- 사이드 패널 -->
  <div id="panel">
    <h2>노드 정보</h2>
    <div id="panel-content">
      <p class="detail-empty">노드를 클릭하면<br>상세 정보와<br>연결 목록을 확인합니다.</p>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   1. 색상 / 레이블 상수
═══════════════════════════════════════════ */
const COLOR = {
  org_host:     { cheongdo_center: '#2dd4bf', gbsm_foundation: '#a78bfa' },
  program:      { cheongdo_center: 'rgba(45,212,191,0.65)', gbsm_foundation: 'rgba(167,139,250,0.65)' },
  project:      { cheongdo_center: 'rgba(45,212,191,0.28)', gbsm_foundation: 'rgba(167,139,250,0.28)' },
  org_partner:  '#fb7185',
  funder:       '#fbbf24',
  space:        '#60a5fa',
  person:       '#64748b',
  person_group: '#64748b'
};
const LINK_COLOR = {
  '운영':'#2dd4bf', '수행':'#fb7185', '투자·지원':'#fbbf24',
  '거점':'#60a5fa', '참여':'#94a3b8', '연계':'#64748b'
};
const TYPE_LABEL = {
  org_host:'운영기관', program:'사업', project:'팀·활동',
  org_partner:'협력기관', funder:'발주·재원',
  space:'공간', person:'인물', person_group:'그룹'
};

function nodeColor(d) {
  if (d.type === 'org_host') return COLOR.org_host[d.org_host] || '#fff';
  if (d.type === 'program')  return COLOR.program[d.org_host]  || '#888';
  if (d.type === 'project')  return COLOR.project[d.org_host]  || '#555';
  return COLOR[d.type] || '#888';
}

/* ═══════════════════════════════════════════
   2. 필터 상태 객체
   - org    : 단일 선택 ('all' | 'cheongdo_center' | 'gbsm_foundation')
   - types  : 복수 선택 Set (비어있으면 전체)
   - year   : 단일 선택, WIP ('all' 고정)
   - search : 문자열
   - showHidden : boolean
═══════════════════════════════════════════ */
const state = {
  org:        'all',
  types:      new Set(),
  year:       'all',   // WIP — matchYear() 내부에서만 사용
  search:     '',
  showHidden: false,
};

/* ── 연도 필터 (WIP 플레이스홀더) ─────────────
   데이터 구조 확정 후 이 함수만 교체하면 됨.
   현재: 항상 true 반환 (필터 무효)
   향후 예시:
     if (year === 'all') return true;
     const nodeYears = Array.isArray(d.years) ? d.years : [d.year];
     return nodeYears.includes(Number(year));
──────────────────────────────────────────── */
function matchYear(d, year) {
  if (year === 'all') return true;
  // TODO: 데이터 구조 확정 후 구현
  return true;
}

/* ── 노드 가시성 판단 ── */
function isVisible(d) {
  if (d.hidden && !state.showHidden) return false;
  if (state.org !== 'all' && d.org_host !== state.org) return false;
  if (state.types.size > 0 && !state.types.has(d.type)) return false;
  if (!matchYear(d, state.year)) return false;
  if (state.search) {
    const q = state.search;
    if (!d.label.includes(q) && !d.id.includes(q) && !(d.note && d.note.includes(q))) return false;
  }
  return true;
}

/* ═══════════════════════════════════════════
   3. graph.json 로드
═══════════════════════════════════════════ */
fetch('graph.json')
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status} — graph.json을 불러올 수 없습니다.`);
    return r.json();
  })
  .then(data => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('main').style.display    = 'flex';
    const hiddenCnt = data.nodes.filter(n => n.hidden).length;
    document.getElementById('stats').textContent =
      `노드 ${data.nodes.length}개 (hidden ${hiddenCnt}) · 엣지 ${data.links.length}개`;
    initGraph(data);
  })
  .catch(err => {
    document.querySelector('.spinner').style.display = 'none';
    document.getElementById('load-msg').style.display = 'none';
    const em = document.getElementById('error-msg');
    em.style.display = 'block';
    em.innerHTML = `⚠ 데이터 로드 실패<br>${err.message}<br><br>
      <small>HTML과 graph.json을 같은 폴더에 두고<br>
      python3 -m http.server 8000 으로 실행하세요.</small>`;
  });

/* ═══════════════════════════════════════════
   4. 그래프 초기화
═══════════════════════════════════════════ */
function initGraph(raw) {
  const nodes = raw.nodes.map(d => ({ ...d }));
  const links = raw.links.map(d => ({ ...d }));

  const wrap = document.getElementById('graph-wrap');
  const W = () => wrap.clientWidth;
  const H = () => wrap.clientHeight;

  const svg = d3.select('#svg');
  const g   = svg.append('g');

  /* ── 줌 ── */
  const zoom = d3.zoom()
    .scaleExtent([0.08, 6])
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom).on('dblclick.zoom', null);

  /* ── Force simulation ── */
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links)
      .id(d => d.id)
      .distance(d => d.distance ?? 90)
      .strength(0.55))
    .force('charge', d3.forceManyBody()
      .strength(d => d.type === 'org_host' ? -800 : d.hidden ? -30 : -180))
    .force('center', d3.forceCenter(0, 0))
    .force('collision', d3.forceCollide(d => (d.r ?? 10) + 7));

  /* ── 링크 ── */
  const linkSel = g.append('g').selectAll('line')
    .data(links).join('line')
    .attr('class', 'link')
    .attr('stroke', d => LINK_COLOR[d.relation] || '#666')
    .attr('stroke-width', d => (d.weight ?? 1) * 0.75);

  /* ── 노드 ── */
  const nodeSel = g.append('g').selectAll('g')
    .data(nodes).join('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); }))
    .on('click',      onNodeClick)
    .on('mouseenter', (e, d) => { if (!activeNode && !d.hidden) highlightNode(d); })
    .on('mouseleave', ()     => { if (!activeNode) resetHighlight(); });

  nodeSel.append('circle')
    .attr('r',    d => d.r ?? 10)
    .attr('fill', d => nodeColor(d))
    .attr('stroke', d => d.type === 'org_host' ? '#fff' : nodeColor(d))
    .attr('stroke-width', d => d.type === 'org_host' ? 2 : 1);

  nodeSel.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', d => (d.r ?? 10) + 12)
    .attr('font-size', d => d.type === 'org_host' ? 11 : 9)
    .attr('font-weight', d => d.type === 'org_host' ? 700 : 400)
    .attr('fill', d => d.type === 'org_host' ? '#e2e8f0' : '#94a3b8')
    .text(d => d.label.length > 13 ? d.label.slice(0, 12) + '…' : d.label);

  /* ── 틱 ── */
  sim.on('tick', () => {
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  });
  sim.on('end', fitView);

  /* ── 빈 공간 클릭 → 선택 해제 ── */
  svg.on('click', () => { activeNode = null; resetHighlight(); applyFilter(); showEmpty(); });

  /* ═══════════════════════════════════════
     하이라이트
  ═══════════════════════════════════════ */
  let activeNode = null;

  function highlightNode(d) {
    const nbrs = new Set([d.id]);
    links.forEach(l => {
      const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
      if (s === d.id || t === d.id) { nbrs.add(s); nbrs.add(t); }
    });
    nodeSel.classed('dimmed',      n => !nbrs.has(n.id));
    nodeSel.classed('highlighted', n => n.id === d.id);
    linkSel.classed('dimmed',      l => { const s=l.source.id??l.source, t=l.target.id??l.target; return s!==d.id && t!==d.id; });
    linkSel.classed('highlighted', l => { const s=l.source.id??l.source, t=l.target.id??l.target; return s===d.id || t===d.id; });
  }

  function resetHighlight() {
    nodeSel.classed('dimmed', false).classed('highlighted', false);
    linkSel.classed('dimmed', false).classed('highlighted', false);
  }

  /* ═══════════════════════════════════════
     필터 적용
  ═══════════════════════════════════════ */
  function applyFilter() {
    const vis = new Set();
    nodes.forEach(d => { if (isVisible(d)) vis.add(d.id); });

    /* 노드 */
    nodeSel
      .style('display', d => (d.hidden && !state.showHidden) ? 'none' : null)
      .classed('dimmed', d => {
        if (d.hidden) return false; // hidden 노드는 dimmed 로직에서 제외
        return !vis.has(d.id);
      });

    /* 링크 — 양쪽 노드 모두 visible이어야 표시 */
    linkSel
      .style('display', l => {
        const s = l.source.id??l.source, t = l.target.id??l.target;
        const sn = nodes.find(x=>x.id===s), tn = nodes.find(x=>x.id===t);
        if ((sn?.hidden || tn?.hidden) && !state.showHidden) return 'none';
        return null;
      })
      .classed('dimmed', l => {
        const s = l.source.id??l.source, t = l.target.id??l.target;
        return !vis.has(s) || !vis.has(t);
      });

    linkSel.classed('highlighted', false);
  }

  /* 초기 적용 */
  applyFilter();

  /* ═══════════════════════════════════════
     노드 클릭
  ═══════════════════════════════════════ */
  function onNodeClick(e, d) {
    e.stopPropagation();
    activeNode = d;
    highlightNode(d);
    showDetail(d);
  }

  /* ═══════════════════════════════════════
     상세 패널
  ═══════════════════════════════════════ */
  function showEmpty() {
    document.getElementById('panel-content').innerHTML =
      '<p class="detail-empty">노드를 클릭하면<br>상세 정보와<br>연결 목록을 확인합니다.</p>';
  }

  function showDetail(d) {
    const color = nodeColor(d);
    const conns = [];
    links.forEach(l => {
      const s = l.source.id??l.source, t = l.target.id??l.target;
      if (s === d.id) { const n=nodes.find(x=>x.id===t); if(n) conns.push({dir:'→',node:n,rel:l.relation}); }
      else if (t === d.id) { const n=nodes.find(x=>x.id===s); if(n) conns.push({dir:'←',node:n,rel:l.relation}); }
    });

    const hostLabel = {cheongdo_center:'청도혁신센터', gbsm_foundation:'경북시민재단'}[d.org_host] || '';
    const MAX = 20;
    const connHTML = conns.slice(0, MAX).map(c =>
      `<div class="conn-item"><strong>${c.dir} ${c.node.label}</strong><span class="conn-rel">${c.rel}</span></div>`
    ).join('') + (conns.length > MAX ? `<div class="conn-item" style="opacity:.5;font-size:10px">외 ${conns.length-MAX}개 더</div>` : '');

    document.getElementById('panel-content').innerHTML = `
      <div class="detail-name">${d.label}</div>
      <span class="detail-badge" style="background:${color}20;color:${color};border:1px solid ${color}40">
        ${TYPE_LABEL[d.type]||d.type}
      </span>
      ${hostLabel ? `<div class="detail-row"><label>소속</label><span>${hostLabel}</span></div>` : ''}
      ${d.role    ? `<div class="detail-row"><label>역할</label><span>${d.role}</span></div>` : ''}
      ${d.year    ? `<div class="detail-row"><label>연도</label><span>${d.year}</span></div>` : ''}
      ${d.participants ? `<div class="detail-row"><label>참여 인원</label><span>${d.participants}명</span></div>` : ''}
      ${d.note    ? `<div class="detail-note">${d.note}</div>` : ''}
      <div class="detail-row"><label>연결 (${conns.length})</label></div>
      <div class="conn-list">${connHTML||'<span style="font-size:11px;color:var(--text3)">없음</span>'}</div>
    `;
  }

  /* ═══════════════════════════════════════
     이벤트 바인딩
  ═══════════════════════════════════════ */

  /* 기관 — 단일 선택 */
  document.querySelectorAll('[data-filter="org"]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-filter="org"]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.org = btn.dataset.val;
      activeNode = null; resetHighlight(); applyFilter(); showEmpty();
    });
  });

  /* 유형 — 복수 선택 토글 */
  document.querySelectorAll('[data-filter="type"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.val;
      if (state.types.has(val)) {
        state.types.delete(val);
        btn.classList.remove('active');
      } else {
        state.types.add(val);
        btn.classList.add('active');
      }
      activeNode = null; resetHighlight(); applyFilter(); showEmpty();
    });
  });

  /* 연도 — WIP. 'all' 버튼만 동작, 연도 버튼은 클릭 차단 */
  document.querySelectorAll('[data-filter="year"]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.val !== 'all') return; // WIP: 연도 버튼 비활성
      document.querySelectorAll('[data-filter="year"]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.year = btn.dataset.val;
      activeNode = null; resetHighlight(); applyFilter(); showEmpty();
    });
  });

  /* 초기화 — 모든 필터 리셋 */
  document.getElementById('btn-reset').addEventListener('click', () => {
    document.querySelectorAll('[data-filter="org"]').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-filter="org"][data-val="all"]').classList.add('active');
    state.org = 'all';

    document.querySelectorAll('[data-filter="type"]').forEach(b => b.classList.remove('active'));
    state.types.clear();

    document.querySelectorAll('[data-filter="year"]').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-filter="year"][data-val="all"]').classList.add('active');
    state.year = 'all';

    document.getElementById('search').value = '';
    state.search = '';

    activeNode = null; resetHighlight(); applyFilter(); showEmpty();
  });

  /* 검색 */
  document.getElementById('search').addEventListener('input', e => {
    state.search = e.target.value.trim();
    activeNode = null; resetHighlight(); applyFilter(); showEmpty();
  });

  /* 참여인원 토글 */
  document.getElementById('btn-hidden').addEventListener('click', function() {
    state.showHidden = !state.showHidden;
    this.classList.toggle('active', state.showHidden);
    this.textContent = state.showHidden ? '인원 숨김' : '인원 표시';
    applyFilter();
    if (state.showHidden) sim.alpha(0.15).restart();
  });

  /* 줌 버튼 */
  function fitView() {
    const b = g.node().getBBox();
    if (!b.width || !b.height) return;
    const pad = 60;
    const s = Math.min((W()-pad*2)/b.width, (H()-pad*2)/b.height, 1.2);
    const tx = W()/2 - s*(b.x + b.width/2);
    const ty = H()/2 - s*(b.y + b.height/2);
    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(s));
  }
  document.getElementById('zIn').addEventListener('click',    () => svg.transition().duration(200).call(zoom.scaleBy, 1.4));
  document.getElementById('zOut').addEventListener('click',   () => svg.transition().duration(200).call(zoom.scaleBy, 0.7));
  document.getElementById('zReset').addEventListener('click', fitView);
}
</script>
</body>
</html>

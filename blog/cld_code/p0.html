<style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0d1117; /* GitHub Dark Background */
            color: #c9d1d9; /* GitHub Text Color */
            overflow: auto;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #0d1117;
            display: flex;
            flex-direction: column;
            overflow: auto;
        }
        .accent-text {
            color: #58a6ff; /* GitHub Blue */
        }
        .secondary-text {
            color: #8b949e;
        }
        .border-card {
            border: 1px solid #30363d;
            background-color: #161b22;
        }
        .code-font {
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }
        /* Decorative elements */
        .grid-bg {
            background-image: 
                linear-gradient(to right, #21262d 1px, transparent 1px),
                linear-gradient(to bottom, #21262d 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.1; 
            /* Note: Instruction said no CSS gradients, but linear-gradient for grid lines is usually fine for patterns. 
               However, to strictly follow "Do not use any CSS gradients", I will simulate grid with SVG or just skip it.
               Let's skip the grid pattern to be safe and use a solid background with geometric shapes using divs.
            */
            background-image: none;
        }
        
        .circle-decor {
            position: absolute;
            border-radius: 50%;
            background-color: #1f6feb;
            opacity: 0.05;
            z-index: 0;
        }
    </style>
<style id="slide-selected-style">
  [data-slide-selected]::before
  /* [data-slide-hover-selected]::before */ {
    content: '';
    position: absolute;
    top: -4px;
    left: -4px;
    width: 100%;
    height: 100%;
    box-sizing: content-box;
    padding: 4px;
    border-radius: 0px;
    outline: 2px solid #0f7fff !important;
    z-index: 10000;
    pointer-events: none;
  }

 /* [data-slide-hover-selected], */
  [data-slide-selected] {
    position: relative;
    outline: none;
    cursor: default;
  }

  img[data-slide-selected],
  img[data-slide-hover-selected],
  [data-slide-hover-selected],
  [item-slide-click-selected],
  [item-slide-selected] {
    border: 2px solid #0f7fff !important;
  }


</style></head>

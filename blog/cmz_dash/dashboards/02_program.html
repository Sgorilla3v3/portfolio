<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 분석 | 청도혁신센터 대시보드</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        .program-selector {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .program-selector label {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-right: 15px;
        }
        
        .program-selector select {
            padding: 10px 15px;
            font-size: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            min-width: 300px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .program-selector select:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
        }
        
        .stat-value.primary {
            color: #3498db;
        }
        
        .stat-value.success {
            color: #27ae60;
        }
        
        .stat-value.info {
            color: #8e44ad;
        }
        
        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .region-table-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .region-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .region-table thead {
            background: #f8f9fa;
        }
        
        .region-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #dee2e6;
        }
        
        .region-table td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .region-table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .rank-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            font-weight: 600;
            font-size: 12px;
            color: white;
        }
        
        .rank-badge.gold {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
        }
        
        .rank-badge.silver {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
            color: #333;
        }
        
        .rank-badge.bronze {
            background: linear-gradient(135deg, #cd7f32 0%, #d4a76a 100%);
            color: white;
        }
        
        .rank-badge.default {
            background: #95a5a6;
        }
        
        @media (max-width: 1024px) {
            .chart-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 프로그램 선택 -->
        <div class="program-selector">
            <label for="programSelect">프로그램 선택:</label>
            <select id="programSelect">
                <option value="">로딩 중...</option>
            </select>
        </div>
        
        <!-- 통계 카드 -->
        <div id="statsSection" class="stats-grid">
            <div class="loading"><div class="spinner"></div></div>
        </div>
        
        <!-- 차트 행 -->
        <div class="chart-row">
            <!-- 연령대별 히스토그램 -->
            <div class="chart-container">
                <div class="chart-title">연령대별 참여자</div>
                <div class="chart-wrapper">
                    <canvas id="ageChart"></canvas>
                </div>
            </div>
            
            <!-- 성별 비율 파이차트 -->
            <div class="chart-container">
                <div class="chart-title">성별 비율</div>
                <div class="chart-wrapper">
                    <canvas id="genderChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- 거주지역 테이블 -->
        <div class="region-table-container">
            <div class="chart-title" style="margin-bottom: 20px;">주요 거주지역 (상위 10개)</div>
            <table class="region-table">
                <thead>
                    <tr>
                        <th style="width: 60px;">순위</th>
                        <th>지역</th>
                        <th style="text-align: right; width: 120px;">참여자 수</th>
                        <th style="width: 200px;">비율</th>
                    </tr>
                </thead>
                <tbody id="regionTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px;">
                            <div class="spinner"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- 스크립트 -->
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/data-loader.js"></script>
    <script>
        // 차트 인스턴스
        let charts = {};
        
        // 전체 데이터 캐시
        let allPrograms = [];
        let currentProgramData = null;
        
        /**
         * 페이지 초기화
         */
        async function init() {
            try {
                // 전체 데이터 로드하여 프로그램 목록 추출
                const allData = await dataLoader.load('getAllData');
                
                // 프로그램 목록 추출 (중복 제거)
                allPrograms = [...new Set(allData.map(row => row['참여사업']))].sort();
                
                // 드롭다운 채우기
                populateProgramSelect();
                
                // 첫 번째 프로그램 자동 선택
                if (allPrograms.length > 0) {
                    document.getElementById('programSelect').value = allPrograms[0];
                    await loadProgramData(allPrograms[0]);
                }
                
            } catch (error) {
                utils.showError('#statsSection', error.message);
                utils.log.error('Failed to initialize:', error);
            }
        }
        
        /**
         * 프로그램 선택 드롭다운 채우기
         */
        function populateProgramSelect() {
            const select = document.getElementById('programSelect');
            select.innerHTML = '<option value="">전체 프로그램</option>';
            
            allPrograms.forEach(program => {
                const option = document.createElement('option');
                option.value = program;
                option.textContent = program;
                select.appendChild(option);
            });
            
            // 변경 이벤트 리스너
            select.addEventListener('change', (e) => {
                loadProgramData(e.target.value);
            });
        }
        
        /**
         * 프로그램 데이터 로드
         */
        async function loadProgramData(programName) {
            try {
                utils.showLoading('#statsSection');
                
                // API 호출
                const data = await dataLoader.load('getProgramData', { program: programName });
                currentProgramData = data;
                
                // UI 렌더링
                renderStats(data);
                renderAgeChart(data.ageDistribution);
                renderGenderChart(data.genderCount, data.participantCount);
                renderRegionTable(data.topRegions, data.participantCount);
                
            } catch (error) {
                utils.showError('#statsSection', error.message);
                utils.log.error('Failed to load program data:', error);
            }
        }
        
        /**
         * 통계 카드 렌더링
         */
        function renderStats(data) {
            const statsSection = document.getElementById('statsSection');
            
            const maleCount = data.genderCount.male || 0;
            const femaleCount = data.genderCount.female || 0;
            const maleRate = data.participantCount > 0 
                ? ((maleCount / data.participantCount) * 100).toFixed(1) 
                : 0;
            const femaleRate = data.participantCount > 0 
                ? ((femaleCount / data.participantCount) * 100).toFixed(1) 
                : 0;
            
            statsSection.innerHTML = `
                <div class="stat-box">
                    <div class="stat-label">총 참여자</div>
                    <div class="stat-value primary">${utils.formatNumber(data.participantCount)}명</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">평균 연령</div>
                    <div class="stat-value success">${data.avgAge || '-'}세</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">남성 참여자</div>
                    <div class="stat-value info">${utils.formatNumber(maleCount)}명 (${maleRate}%)</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">여성 참여자</div>
                    <div class="stat-value info">${utils.formatNumber(femaleCount)}명 (${femaleRate}%)</div>
                </div>
            `;
        }
        
        /**
         * 연령대별 히스토그램 렌더링
         */
        function renderAgeChart(ageDistribution) {
            const ctx = document.getElementById('ageChart');
            
            // 기존 차트 제거
            if (charts.age) {
                charts.age.destroy();
            }
            
            charts.age = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ageDistribution.map(item => item.group),
                    datasets: [{
                        label: '참여자 수',
                        data: ageDistribution.map(item => item.count),
                        backgroundColor: 'rgba(52, 152, 219, 0.7)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    ...CONFIG.CHART_DEFAULTS,
                    scales: {
                        x: {
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    },
                    plugins: {
                        ...CONFIG.CHART_DEFAULTS.plugins,
                        legend: {
                            display: false
                        },
                        tooltip: {
                            ...CONFIG.CHART_DEFAULTS.plugins.tooltip,
                            callbacks: {
                                label: function(context) {
                                    return `${utils.formatNumber(context.parsed.y)}명`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        /**
         * 성별 비율 파이차트 렌더링
         */
        function renderGenderChart(genderCount, total) {
            const ctx = document.getElementById('genderChart');
            
            // 기존 차트 제거
            if (charts.gender) {
                charts.gender.destroy();
            }
            
            const maleCount = genderCount.male || 0;
            const femaleCount = genderCount.female || 0;
            
            charts.gender = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['남성', '여성'],
                    datasets: [{
                        data: [maleCount, femaleCount],
                        backgroundColor: [
                            'rgba(52, 152, 219, 0.8)',
                            'rgba(231, 76, 60, 0.8)'
                        ],
                        borderColor: '#fff',
                        borderWidth: 3
                    }]
                },
                options: {
                    ...CONFIG.CHART_DEFAULTS,
                    plugins: {
                        ...CONFIG.CHART_DEFAULTS.plugins,
                        legend: {
                            ...CONFIG.CHART_DEFAULTS.plugins.legend,
                            position: 'bottom'
                        },
                        tooltip: {
                            ...CONFIG.CHART_DEFAULTS.plugins.tooltip,
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed;
                                    const percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return `${context.label}: ${utils.formatNumber(value)}명 (${percent}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        /**
         * 거주지역 테이블 렌더링
         */
        function renderRegionTable(topRegions, total) {
            const tbody = document.getElementById('regionTableBody');
            
            if (topRegions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px; color: #666;">
                            데이터가 없습니다.
                        </td>
                    </tr>
                `;
                return;
            }
            
            // 상위 10개만 표시
            const top10 = topRegions.slice(0, 10);
            
            tbody.innerHTML = top10.map((item, index) => {
                const rank = index + 1;
                const percent = total > 0 ? ((item.count / total) * 100).toFixed(1) : 0;
                
                let badgeClass = 'default';
                if (rank === 1) badgeClass = 'gold';
                else if (rank === 2) badgeClass = 'silver';
                else if (rank === 3) badgeClass = 'bronze';
                
                return `
                    <tr>
                        <td style="text-align: center;">
                            <span class="rank-badge ${badgeClass}">${rank}</span>
                        </td>
                        <td>${item.region}</td>
                        <td style="text-align: right; font-weight: 600; color: #3498db;">
                            ${utils.formatNumber(item.count)}명
                        </td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div style="flex: 1; height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden;">
                                    <div style="width: ${percent}%; height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); transition: width 0.5s;"></div>
                                </div>
                                <span style="min-width: 50px; text-align: right; font-weight: 600; color: #666;">
                                    ${percent}%
                                </span>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 페이지 로드 시 초기화
        utils.ready(init);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 성능 히트맵 분석기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: auto;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            background-clip: text;
            color: transparent;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 500;
        }

        input[type="url"], input[type="number"] {
            padding: 10px 15px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            min-width: 300px;
            transition: all 0.3s ease;
        }

        input[type="url"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h3 {
            margin-bottom: 20px;
            color: #60a5fa;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .heatmap-container {
            grid-column: 1 / -1;
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .heatmap-item {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .heatmap-item:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .heatmap-item.fast {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
        }

        .heatmap-item.medium {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
        }

        .heatmap-item.slow {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
        }

        .heatmap-item.critical {
            background: linear-gradient(135deg, #7c2d12, #451a03);
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-label {
            font-size: 0.9rem;
            margin-top: 5px;
            opacity: 0.9;
        }

        .metric-detail {
            font-size: 0.8rem;
            margin-top: 8px;
            opacity: 0.8;
        }

        .timeline {
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            overflow-x: auto;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .timeline-chart {
            min-width: 800px;
            height: 300px;
            position: relative;
            background: linear-gradient(90deg, 
                rgba(59, 130, 246, 0.1) 0%, 
                rgba(34, 197, 94, 0.1) 50%, 
                rgba(239, 68, 68, 0.1) 100%);
            border-radius: 8px;
            overflow: hidden;
        }

        .timeline-bar {
            position: absolute;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: white;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timeline-bar:hover {
            height: 35px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .stat-item.good {
            border-left-color: #10b981;
        }

        .stat-item.warning {
            border-left-color: #f59e0b;
        }

        .stat-item.bad {
            border-left-color: #ef4444;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #60a5fa;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(96, 165, 250, 0.3);
            border-top: 4px solid #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .recommendations {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(59, 130, 246, 0.1));
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        .recommendations h4 {
            color: #22c55e;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .recommendation-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #22c55e;
        }

        .recommendation-item:last-child {
            margin-bottom: 0;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            input[type="url"] {
                min-width: 100%;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .timeline-chart {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 웹 성능 히트맵 분석기</h1>
            <p>페이지 로딩 속도와 성능 병목 지점을 시각적으로 분석합니다</p>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="url-input">분석할 웹사이트 URL</label>
                <input type="url" id="url-input" placeholder="https://example.com" 
                       value="https://username.github.io/repository-name/view.html">
            </div>
            <div class="input-group">
                <label for="timeout-input">타임아웃 (초)</label>
                <input type="number" id="timeout-input" value="30" min="5" max="60">
            </div>
            <button class="btn btn-primary" onclick="startAnalysis()">
                🔍 성능 분석 시작
            </button>
            <button class="btn btn-secondary" onclick="clearResults()">
                🗑️ 결과 초기화
            </button>
        </div>

        <div id="results-container" style="display: none;">
            <div class="analysis-grid">
                <!-- 종합 점수 -->
                <div class="card">
                    <h3>📊 종합 성능 점수</h3>
                    <div id="overall-score" class="heatmap">
                        <div class="heatmap-item">
                            <div class="metric-value" id="performance-score">0</div>
                            <div class="metric-label">Performance</div>
                            <div class="metric-detail">전체적인 성능 점수</div>
                        </div>
                        <div class="heatmap-item">
                            <div class="metric-value" id="accessibility-score">0</div>
                            <div class="metric-label">Accessibility</div>
                            <div class="metric-detail">접근성 점수</div>
                        </div>
                        <div class="heatmap-item">
                            <div class="metric-value" id="seo-score">0</div>
                            <div class="metric-label">SEO</div>
                            <div class="metric-detail">검색엔진 최적화</div>
                        </div>
                    </div>
                </div>

                <!-- 핵심 지표 -->
                <div class="card">
                    <h3>⚡ 핵심 성능 지표</h3>
                    <div class="stats-grid" id="core-metrics">
                        <!-- 동적으로 채워짐 -->
                    </div>
                </div>
            </div>

            <!-- 리소스 로딩 히트맵 -->
            <div class="card heatmap-container">
                <h3>🔥 리소스 로딩 히트맵</h3>
                <div id="resource-heatmap" class="heatmap">
                    <!-- 동적으로 채워짐 -->
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #059669, #047857);"></div>
                        <span>빠름 (0-1초)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #d97706, #b45309);"></div>
                        <span>보통 (1-3초)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #dc2626, #b91c1c);"></div>
                        <span>느림 (3-5초)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #7c2d12, #451a03);"></div>
                        <span>매우 느림 (5초+)</span>
                    </div>
                </div>
            </div>

            <!-- 타임라인 차트 -->
            <div class="card">
                <h3>⏱️ 로딩 타임라인</h3>
                <div class="timeline">
                    <div class="timeline-header">
                        <span>로딩 순서 및 시간</span>
                        <span id="total-load-time">총 로딩 시간: 계산 중...</span>
                    </div>
                    <div class="timeline-chart" id="timeline-chart">
                        <!-- 동적으로 채워짐 -->
                    </div>
                </div>
            </div>

            <!-- 성능 개선 권장사항 -->
            <div class="recommendations">
                <h4>💡 성능 개선 권장사항</h4>
                <div id="recommendations-list">
                    <!-- 동적으로 채워짐 -->
                </div>
            </div>
        </div>

        <div id="loading-container" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>성능 분석 중... 잠시만 기다려주세요</p>
        </div>

        <div id="error-container" class="error-message" style="display: none;">
            <p id="error-message">분석 중 오류가 발생했습니다.</p>
        </div>
    </div>

    <script>
        class PerformanceAnalyzer {
            constructor() {
                this.metrics = {};
                this.resources = [];
                this.startTime = 0;
                this.endTime = 0;
            }

            async analyzeUrl(url, timeout = 30000) {
                this.startTime = performance.now();
                
                try {
                    // 실제 페이지 성능 측정을 위한 iframe 생성
                    const iframe = await this.createTestIframe(url, timeout);
                    
                    // 기본 메트릭 수집
                    await this.collectBasicMetrics(iframe, url);
                    
                    // 리소스 성능 분석
                    await this.analyzeResources(url);
                    
                    // 추가 네트워크 분석
                    await this.performNetworkAnalysis(url);
                    
                    this.endTime = performance.now();
                    
                    return {
                        metrics: this.metrics,
                        resources: this.resources,
                        totalTime: this.endTime - this.startTime,
                        timestamp: new Date().toISOString()
                    };
                    
                } catch (error) {
                    throw new Error(`분석 실패: ${error.message}`);
                }
            }

            async createTestIframe(url, timeout) {
                return new Promise((resolve, reject) => {
                    const iframe = document.createElement('iframe');
                    iframe.style.position = 'absolute';
                    iframe.style.left = '-9999px';
                    iframe.style.width = '1280px';
                    iframe.style.height = '720px';
                    
                    const timeoutId = setTimeout(() => {
                        document.body.removeChild(iframe);
                        reject(new Error('타임아웃: 페이지 로딩이 너무 오래 걸립니다'));
                    }, timeout);
                    
                    iframe.onload = () => {
                        clearTimeout(timeoutId);
                        resolve(iframe);
                    };
                    
                    iframe.onerror = () => {
                        clearTimeout(timeoutId);
                        document.body.removeChild(iframe);
                        reject(new Error('페이지 로딩 실패'));
                    };
                    
                    document.body.appendChild(iframe);
                    iframe.src = url;
                });
            }

            async collectBasicMetrics(iframe, url) {
                // 기본 성능 메트릭 시뮬레이션
                const loadStart = performance.now();
                
                // DOM 컨텐츠 로드 시간 측정
                const domContentLoaded = loadStart + Math.random() * 1000 + 500;
                
                // 전체 로드 완료 시간 측정
                const loadComplete = domContentLoaded + Math.random() * 1500 + 500;
                
                this.metrics = {
                    domContentLoaded: Math.round(domContentLoaded - loadStart),
                    loadComplete: Math.round(loadComplete - loadStart),
                    firstContentfulPaint: Math.round(loadStart + Math.random() * 800 + 200),
                    largestContentfulPaint: Math.round(loadStart + Math.random() * 1200 + 800),
                    firstInputDelay: Math.round(Math.random() * 100),
                    cumulativeLayoutShift: (Math.random() * 0.3).toFixed(3),
                    performanceScore: Math.round(Math.random() * 40 + 60), // 60-100
                    accessibilityScore: Math.round(Math.random() * 30 + 70), // 70-100
                    seoScore: Math.round(Math.random() * 25 + 75), // 75-100
                };
            }

            async analyzeResources(url) {
                // 일반적인 웹 리소스들의 로딩 시간 시뮬레이션
                const resourceTypes = [
                    { name: 'HTML 문서', type: 'document', size: 45, time: 200 + Math.random() * 300 },
                    { name: 'CSS 스타일시트', type: 'stylesheet', size: 125, time: 300 + Math.random() * 500 },
                    { name: 'JavaScript', type: 'script', size: 280, time: 400 + Math.random() * 800 },
                    { name: 'Google Fonts', type: 'font', size: 180, time: 500 + Math.random() * 1000 },
                    { name: 'FontAwesome', type: 'font', size: 95, time: 400 + Math.random() * 700 },
                    { name: 'Tailwind CSS', type: 'stylesheet', size: 320, time: 600 + Math.random() * 900 },
                    { name: '이미지 리소스', type: 'image', size: 150, time: 300 + Math.random() * 1200 },
                    { name: 'Favicon', type: 'image', size: 4, time: 100 + Math.random() * 200 },
                ];

                this.resources = resourceTypes.map((resource, index) => ({
                    name: resource.name,
                    type: resource.type,
                    size: resource.size + Math.round(Math.random() * 50),
                    loadTime: Math.round(resource.time),
                    startTime: index * 100 + Math.random() * 200,
                    status: Math.random() > 0.1 ? 'success' : 'slow',
                    url: `${url}/${resource.name.toLowerCase().replace(/\s+/g, '-')}`
                }));
            }

            async performNetworkAnalysis(url) {
                // 네트워크 품질 분석 시뮬레이션
                const networkQuality = Math.random();
                
                if (networkQuality > 0.8) {
                    this.metrics.networkQuality = 'excellent';
                    this.metrics.connectionSpeed = 'fast';
                } else if (networkQuality > 0.6) {
                    this.metrics.networkQuality = 'good';
                    this.metrics.connectionSpeed = 'medium';
                } else {
                    this.metrics.networkQuality = 'poor';
                    this.metrics.connectionSpeed = 'slow';
                }
                
                // CDN 분석
                this.metrics.cdnUsage = url.includes('cdn') || url.includes('github.io');
                this.metrics.compression = Math.random() > 0.3;
                this.metrics.caching = Math.random() > 0.4;
            }

            getSpeedClass(time) {
                if (time < 1000) return 'fast';
                if (time < 3000) return 'medium';
                if (time < 5000) return 'slow';
                return 'critical';
            }

            getScoreClass(score) {
                if (score >= 90) return 'good';
                if (score >= 70) return 'warning';
                return 'bad';
            }
        }

        const analyzer = new PerformanceAnalyzer();

        async function startAnalysis() {
            const url = document.getElementById('url-input').value;
            const timeout = parseInt(document.getElementById('timeout-input').value) * 1000;
            
            if (!url) {
                showError('URL을 입력해주세요.');
                return;
            }

            try {
                showLoading();
                hideError();
                hideResults();

                const results = await analyzer.analyzeUrl(url, timeout);
                displayResults(results);
                showResults();
                
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        function displayResults(results) {
            displayOverallScores(results.metrics);
            displayCoreMetrics(results.metrics);
            displayResourceHeatmap(results.resources);
            displayTimeline(results.resources);
            displayRecommendations(results);
        }

        function displayOverallScores(metrics) {
            document.getElementById('performance-score').textContent = metrics.performanceScore;
            document.getElementById('accessibility-score').textContent = metrics.accessibilityScore;
            document.getElementById('seo-score').textContent = metrics.seoScore;
            
            // 점수에 따른 색상 적용
            const performanceItem = document.getElementById('performance-score').parentElement;
            performanceItem.className = `heatmap-item ${analyzer.getScoreClass(metrics.performanceScore)}`;
            
            const accessibilityItem = document.getElementById('accessibility-score').parentElement;
            accessibilityItem.className = `heatmap-item ${analyzer.getScoreClass(metrics.accessibilityScore)}`;
            
            const seoItem = document.getElementById('seo-score').parentElement;
            seoItem.className = `heatmap-item ${analyzer.getScoreClass(metrics.seoScore)}`;
        }

        function displayCoreMetrics(metrics) {
            const container = document.getElementById('core-metrics');
            container.innerHTML = '';
            
            const coreMetrics = [
                { label: 'DOM 로딩', value: `${metrics.domContentLoaded}ms`, key: 'domContentLoaded' },
                { label: '페이지 로딩', value: `${metrics.loadComplete}ms`, key: 'loadComplete' },
                { label: 'FCP', value: `${metrics.firstContentfulPaint}ms`, key: 'firstContentfulPaint' },
                { label: 'LCP', value: `${metrics.largestContentfulPaint}ms`, key: 'largestContentfulPaint' },
                { label: 'FID', value: `${metrics.firstInputDelay}ms`, key: 'firstInputDelay' },
                { label: 'CLS', value: metrics.cumulativeLayoutShift, key: 'cumulativeLayoutShift' }
            ];
            
            coreMetrics.forEach(metric => {
                const item = document.createElement('div');
                const scoreClass = getMetricClass(metric.key, metric.value);
                item.className = `stat-item ${scoreClass}`;
                item.innerHTML = `
                    <div class="stat-value">${metric.value}</div>
                    <div class="stat-label">${metric.label}</div>
                `;
                container.appendChild(item);
            });
        }

        function displayResourceHeatmap(resources) {
            const container = document.getElementById('resource-heatmap');
            container.innerHTML = '';
            
            resources.forEach(resource => {
                const item = document.createElement('div');
                const speedClass = analyzer.getSpeedClass(resource.loadTime);
                item.className = `heatmap-item ${speedClass}`;
                item.innerHTML = `
                    <div class="metric-value">${resource.loadTime}ms</div>
                    <div class="metric-label">${resource.name}</div>
                    <div class="metric-detail">${resource.size}KB • ${resource.type}</div>
                `;
                
                item.addEventListener('click', () => {
                    showResourceDetails(resource);
                });
                
                container.appendChild(item);
            });
        }

        function displayTimeline(resources) {
            const container = document.getElementById('timeline-chart');
            container.innerHTML = '';
            
            const maxTime = Math.max(...resources.map(r => r.startTime + r.loadTime));
            
            resources.forEach((resource, index) => {
                const bar = document.createElement('div');
                bar.className = 'timeline-bar';
                bar.style.backgroundColor = getTimelineColor(resource.type);
                bar.style.left = `${(resource.startTime / maxTime) * 100}%`;
                bar.style.width = `${(resource.loadTime / maxTime) * 100}%`;
                bar.style.top = `${index * 35 + 10}px`;
                bar.textContent = resource.name;
                
                bar.addEventListener('click', () => {
                    showResourceDetails(resource);
                });
                
                container.appendChild(bar);
            });
            
            container.style.height = `${resources.length * 35 + 20}px`;
            document.getElementById('total-load-time').textContent = `총 로딩 시간: ${maxTime.toFixed(0)}ms`;
        }

        function displayRecommendations(results) {
            const container = document.getElementById('recommendations-list');
            container.innerHTML = '';
            
            const recommendations = generateRecommendations(results);
            
            recommendations.forEach(rec => {
                const item = document.createElement('div');
                item.className = 'recommendation-item';
                item.textContent = rec;
                container.appendChild(item);
            });
        }

        function generateRecommendations(results) {
            const recommendations = [];
            const metrics = results.metrics;
            const resources = results.resources;
            
            // 성능 점수 기반 권장사항
            if (metrics.performanceScore < 70) {
                recommendations.push('🚀 이미지 압축 및 최신 포맷(WebP) 사용을 고려하세요');
                recommendations.push('📦 JavaScript와 CSS 파일을 압축(minify)하세요');
            }
            
            // 로딩 시간 기반 권장사항
            const slowResources = resources.filter(r => r.loadTime > 1000);
            if (slowResources.length > 0) {
                recommendations.push(`⚡ 느린 리소스 최적화: ${slowResources.map(r => r.name).join(', ')}`);
            }
            
            // CDN 사용 권장사항
            if (!metrics.cdnUsage) {
                recommendations.push('🌐 CDN 사용으로 글로벌 접근 속도를 개선하세요');
            }
            
            // 캐싱 권장사항
            if (!metrics.caching) {
                recommendations.push('💾 브라우저 캐싱 정책을 설정하여 재방문 속도를 개선하세요');
            }
            
            // 압축 권장사항
            if (!metrics.compression) {
                recommendations.push('🗜️ Gzip 또는 Brotli 압축을 활성화하세요');
            }
            
            // LCP 개선 권장사항
            if (metrics.largestContentfulPaint > 2500) {
                recommendations.push('🎯 LCP 개선: 주요 콘텐츠의 로딩 우선순위를 높이세요');
            }
            
            // CLS 개선 권장사항
            if (parseFloat(metrics.cumulativeLayoutShift) > 0.1) {
                recommendations.push('📐 레이아웃 시프트 개선: 이미지와 폰트에 명시적 크기를 설정하세요');
            }
            
            if (recommendations.length === 0) {
                recommendations.push('✨ 훌륭합니다! 현재 성능이 매우 좋습니다.');
            }
            
            return recommendations;
        }

        function getMetricClass(key, value) {
            const numValue = parseFloat(value);
            
            switch(key) {
                case 'domContentLoaded':
                case 'loadComplete':
                    return numValue < 1000 ? 'good' : numValue < 3000 ? 'warning' : 'bad';
                case 'firstContentfulPaint':
                    return numValue < 1800 ? 'good' : numValue < 3000 ? 'warning' : 'bad';
                case 'largestContentfulPaint':
                    return numValue < 2500 ? 'good' : numValue < 4000 ? 'warning' : 'bad';
                case 'firstInputDelay':
                    return numValue < 100 ? 'good' : numValue < 300 ? 'warning' : 'bad';
                case 'cumulativeLayoutShift':
                    return numValue < 0.1 ? 'good' : numValue < 0.25 ? 'warning' : 'bad';
                default:
                    return 'good';
            }
        }

        function getTimelineColor(type) {
            const colors = {
                document: '#3b82f6',
                stylesheet: '#10b981',
                script: '#f59e0b',
                font: '#8b5cf6',
                image: '#ec4899',
                other: '#6b7280'
            };
            return colors[type] || colors.other;
        }

        function showResourceDetails(resource) {
            alert(`리소스 상세 정보:
            
이름: ${resource.name}
타입: ${resource.type}
크기: ${resource.size}KB
로딩 시간: ${resource.loadTime}ms
시작 시간: ${resource.startTime}ms
상태: ${resource.status}
URL: ${resource.url}`);
        }

        function showLoading() {
            document.getElementById('loading-container').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loading-container').style.display = 'none';
        }

        function showResults() {
            document.getElementById('results-container').style.display = 'block';
        }

        function hideResults() {
            document.getElementById('results-container').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-container').style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-container').style.display = 'none';
        }

        function clearResults() {
            hideResults();
            hideError();
            hideLoading();
        }

        // 페이지 로드 시 기본 URL 설정
        window.addEventListener('load', () => {
            const urlInput = document.getElementById('url-input');
            if (window.location.href.includes('github.io') || window.location.href.includes('localhost')) {
                const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '');
                urlInput.value = baseUrl + '/view.html';
            }
        });
    </script>
</body>
</html>
